<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframe App</title>
<style>
  body { font: 15px system-ui; margin: 16px; }
  iframe { border: 1px solid #ccc; width: 520px; height: 300px; vertical-align: top; }
</style>
</head>
<body>
<!-- Like a cloud console: the page around the feature is chrome (menus, banners), and the
     feature itself lives in an iframe. -->
<div id="banner">We use cookies to run this console. Services: compute, storage, databases, networking, analytics, machine learning, security, monitoring, logging, billing.</div>
<button id="top">Top button</button>
<iframe id="feature" title="Feature frame" src="/iframe-app-inner.html"></iframe>
<iframe id="remote" title="Remote frame" src="http://localhost:8765/iframe-app-inner.html?remote=1"></iframe>
<script>
  // ?alt=PORT: a frame of the same site on another port (another origin, same process), which
  // the page's own script cannot reach. ?scaled=1: the cross-site frame drawn at half size.
  const q = new URLSearchParams(location.search);
  if (q.get('alt')) {
    const f = document.createElement('iframe');
    f.id = 'alt';
    f.title = 'Alt frame';
    f.src = `http://127.0.0.1:${q.get('alt')}/iframe-app-inner.html?alt=1`;
    document.body.append(f);
  }
  if (q.get('scaled')) document.getElementById('remote').style.transform = 'scale(0.5)';
  // ?remotealt=PORT: the cross-site frame embeds a frame of its own site on another port.
  if (q.get('remotealt')) document.getElementById('remote').src += `&nestalt=${q.get('remotealt')}`;
  // ?wide=1: the feature frame holds an element larger than the frame.
  if (q.get('wide')) document.getElementById('feature').src = '/iframe-app-inner.html?wide=1';
  // ?deepremote=1: the feature frame embeds a cross-site frame. ?althidden=1: the alt frame is
  // visibility:hidden. ?shadow=1: a cross-site frame inside an open shadow root.
  if (q.get('deepremote')) document.getElementById('feature').src = '/iframe-app-inner.html?nestremote=1';
  if (q.get('altnest')) document.getElementById('alt').src += `&nestport=${q.get('altnest')}${q.get('covernest') ? '&covernest=1' : ''}`;
  if (q.get('squash')) document.getElementById('feature').style.cssText += ';transform:scale(1, 0.5);transform-origin:0 0';
  if (q.get('rotate')) document.getElementById(q.get('rotate')).style.cssText += ';transform:rotate(15deg)';
  // ?dupes=1: a hidden copy of the feature's Run button in the page, and a hidden frame of
  // another origin with a copy of the alt frame's button.
  if (q.get('dupes')) {
    const b = document.createElement('button');
    b.textContent = 'Run query';
    b.style.display = 'none';
    document.body.append(b);
    if (q.get('alt')) {
      const f = document.createElement('iframe');
      f.src = `http://127.0.0.1:${q.get('alt')}/iframe-app-inner.html?alt=1`;
      f.style.display = 'none';
      document.body.append(f);
    }
  }
  // ?vishidden=1: a visibility:hidden page copy of the cross-site frame's button.
  if (q.get('vishidden')) {
    const b = document.createElement('button');
    b.textContent = 'Run remote query';
    b.style.visibility = 'hidden';
    document.body.append(b);
  }
  if (q.get('remotehidden')) document.getElementById('remote').style.visibility = 'hidden';
  if (q.get('closed')) document.getElementById('feature').src = '/iframe-app-inner.html?closed=1';
  // ?closedframe=1: a same-origin iframe inside a closed shadow root.
  if (q.get('closedframe')) {
    const host = document.createElement('div');
    host.id = 'closedFrameHost';
    const f = document.createElement('iframe');
    f.src = '/iframe-app-inner.html?closed=1&deep=1';
    f.style.cssText = 'width:520px;height:300px;border:0';
    host.attachShadow({ mode: 'closed' }).append(f);
    document.body.prepend(host);
  }
  if (q.get('althidden')) document.getElementById('alt').style.visibility = 'hidden';
  if (q.get('shadow')) {
    const host = document.createElement('div');
    host.id = 'host';
    const f = document.createElement('iframe');
    f.src = 'http://localhost:8765/iframe-app-inner.html?remote=1&shadowq=1';
    f.style.cssText = 'width:520px;height:300px;border:0';
    host.attachShadow({ mode: 'open' }).append(f);
    document.body.prepend(host);
  }
  // ?traps=1: a hidden iframe over a page button, page elements drawn over both frames, and a
  // large element in a frame nested in a small frame.
  if (q.get('traps')) {
    window.underClicks = 0;
    const under = document.createElement('button');
    under.id = 'under';
    under.textContent = 'Under';
    under.style.cssText = 'position:absolute;left:20px;top:420px;width:200px;height:60px';
    under.onclick = () => underClicks++;
    const ghost = document.createElement('iframe');
    ghost.id = 'ghostframe';
    ghost.srcdoc = '<button id="ghost" style="width:180px;height:50px">Ghost</button>';
    ghost.style.cssText = 'position:absolute;left:20px;top:420px;width:200px;height:60px;border:0;visibility:hidden';
    document.body.append(under, ghost);
    for (const id of ['feature', 'remote', 'alt']) {
      const f = document.getElementById(id);
      if (!f) continue;
      const c = document.createElement('div');
      c.className = 'cover';
      c.style.cssText = `position:absolute;left:${f.offsetLeft}px;top:${f.offsetTop}px;width:${f.offsetWidth}px;height:${f.offsetHeight}px;background:rgba(255,0,0,.2)`;
      document.body.append(c);
    }
    const outer = document.createElement('iframe');
    outer.id = 'outer';
    outer.style.cssText = 'position:absolute;left:300px;top:420px;width:200px;height:150px;border:0';
    outer.srcdoc = '<body style="margin:0"><iframe id="inner" style="width:500px;height:500px;border:0" srcdoc="&lt;div id=big style=&quot;width:480px;height:480px;background:#fca5a5&quot;&gt;Big&lt;/div&gt;"></iframe>'
      + (q.get('alt') ? `<iframe id="innerAlt" style="width:950px;height:450px;border:0" src="http://127.0.0.1:${q.get('alt')}/iframe-app-inner.html?wide=1"></iframe>` : '') + '</body>';
    document.body.append(outer);
  }
  // ?only=alt: just the frame of another origin.
  if (q.get('only') === 'alt') { document.getElementById('feature').remove(); document.getElementById('remote').remove(); }
</script>
</body>
</html>
